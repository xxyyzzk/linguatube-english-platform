<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A video-based English learning interface with synchronized bilingual subtitles and shadowing practice."
    >
    <title>LinguaTube Studio</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=20260909-space-hold-2x">
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="./app.js?v=20260909-space-hold-2x"></script>
  </head>
  <body>
    <div id="fileModeNotice" class="runtime-notice" hidden>
      <div>
        <strong>Open the local app URL</strong>
        <span>The YouTube player needs the local app server to load reliably.</span>
      </div>
      <a id="localPreviewLink" href="http://127.0.0.1:8789/">Open app</a>
    </div>

    <main class="platform-shell">
      <section class="learning-stage" aria-label="Video learning area">
        <header class="stage-header">
          <div class="header-left">
            <h2 id="lessonTitle">Loading lesson</h2>
          </div>
          <div class="header-actions">
            <button
              id="toggleFullscreen"
              class="ghost-button fullscreen-toggle"
              type="button"
              aria-pressed="false"
              aria-label="Fullscreen video with subtitles"
              title="Fullscreen video with subtitles"
            >
              <i data-lucide="maximize" aria-hidden="true"></i>
              <span>Fullscreen</span>
            </button>
            <div class="saved-videos-menu">
              <button
                id="savedVideosToggle"
                class="ghost-button saved-videos-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="savedVideosPanel"
              >
                <i data-lucide="list-video" aria-hidden="true"></i>
                <span>Saved videos</span>
                <span id="savedVideosCount" class="saved-videos-count">0</span>
              </button>
              <div id="savedVideosPanel" class="saved-videos-panel" hidden>
                <div class="saved-videos-head">
                  <p class="section-kicker">Saved videos</p>
                  <button id="closeSavedVideos" class="small-button close-saved-videos" type="button" aria-label="Close saved videos">
                    <i data-lucide="x" aria-hidden="true"></i>
                  </button>
                </div>
                <div id="savedVideosList" class="saved-videos-list"></div>
              </div>
            </div>
          </div>
        </header>

        <div class="watch-layout">
          <section class="video-workspace" aria-label="Video player">
            <div class="video-shell">
              <div id="player" class="youtube-player"></div>
              <div id="videoFallback" class="video-fallback">
                <div class="fallback-poster" aria-hidden="true"></div>
                <p>Preparing video</p>
              </div>
              <button
                id="exitFullscreenOverlay"
                class="fullscreen-exit"
                type="button"
                aria-label="Exit fullscreen"
                title="Exit fullscreen"
              >
                <i data-lucide="minimize" aria-hidden="true"></i>
              </button>
              <div
                id="captionOverlay"
                class="caption-overlay"
                aria-live="polite"
                aria-label="Draggable subtitles"
                title="Drag to move subtitles"
                tabindex="0"
              >
                <p id="captionEnglish"></p>
                <p id="captionChinese"></p>
              </div>
            </div>

            <section class="practice-strip" aria-label="Current subtitle">
              <div>
                <p class="section-kicker">Subtitle</p>
                <p id="practiceLine" class="practice-line"></p>
              </div>
              <div class="practice-actions">
                <button id="copyPracticeLine" class="ghost-button copy-button" type="button" aria-label="Copy current subtitle">
                  <i data-lucide="copy" aria-hidden="true"></i>
                  <span>Copy</span>
                </button>
              </div>
            </section>

            <section class="custom-lesson inline-video-loader" aria-label="Add YouTube video">
              <p class="section-kicker">Add YouTube video</p>
              <form id="customLessonForm" class="custom-form inline-custom-form">
                <label class="video-link-field">
                  <span>Video link</span>
                  <input
                    id="customVideoUrl"
                    type="url"
                    placeholder="https://www.youtube.com/watch?v=..."
                    required
                  >
                </label>
                <input id="customTitle" type="hidden" value="">
                <textarea id="customTranscript" hidden></textarea>
                <button class="primary-button" type="submit">
                  <i data-lucide="plus" aria-hidden="true"></i>
                  <span>Load video</span>
                </button>
                <p id="customStatus" class="custom-status" role="status"></p>
              </form>
            </section>

          </section>

          <button
            id="splitResizeHandle"
            class="split-resize-handle"
            type="button"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize video and subtitles"
            title="Drag to resize video and subtitles"
          >
            <i data-lucide="grip-vertical" aria-hidden="true"></i>
          </button>

          <section class="subtitle-panel" aria-label="Synchronized subtitles">
            <div class="subtitle-toolbar">
              <div class="subtitle-modes" role="group" aria-label="Subtitle display mode">
                <button class="mode-button active" type="button" data-mode="both">EN/ZH</button>
                <button class="mode-button" type="button" data-mode="en">EN</button>
                <button class="mode-button" type="button" data-mode="zh">ZH</button>
                <button class="mode-button" type="button" data-mode="none" aria-label="No subtitles">OFF</button>
              </div>
              <div class="subtitle-actions">
                <button id="bookmarkLesson" class="ghost-button" type="button">
                  <i data-lucide="bookmark" aria-hidden="true"></i>
                  <span>Save</span>
                </button>
              </div>
              <div class="subtitle-file-actions">
                <button id="importSrt" class="ghost-button srt-file-button" type="button" aria-label="Import SRT subtitles">
                  <i data-lucide="upload" aria-hidden="true"></i>
                  <span>Import SRT</span>
                </button>
                <button id="downloadSrt" class="ghost-button srt-file-button" type="button" aria-label="Download English subtitles as SRT">
                  <i data-lucide="download" aria-hidden="true"></i>
                  <span>Download EN SRT</span>
                </button>
              </div>
              <input id="subtitleFileInput" type="file" accept=".srt,text/plain" hidden>
            </div>

            <input id="subtitleSearch" type="hidden" value="">

            <div id="subtitleList" class="subtitle-list"></div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
